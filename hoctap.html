
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học Tập</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap"
      rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

:root {
    --green: #d7ff9a;
    --red: #d00000;
    --gold: #ffdf4e;
    --cream: #fff0b0;
    --orange: #ffb16c;
    --brown: #7d321b;
}

html, body {
    margin: 0;
    min-height: 100%;
}

body {
    font-family: Arial, sans-serif;
    background: var(--green);
}

.page {
    position: relative;
    isolation: isolate;
    min-height: 100vh;
    overflow: hidden;
    padding: 0 3.35% 30px;
    background:
        radial-gradient(ellipse at 0% 100%,
            #a7cd7b 0%, transparent 35%),
        radial-gradient(ellipse at 100% 100%,
            #b6d981 0%, transparent 35%),
        #d7ff9a;
}

/* ================= NỀN MINH HỌA ================= */

.scenery {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
    pointer-events: none;
}

/* CÀNH LIỄU BÊN TRÁI */

.willow {
    position: absolute;
    top: -15px;
    left: -15px;
    width: clamp(150px, 19vw, 300px);
    z-index: -1;
    pointer-events: none;
}

/* CÀNH CÂY BÊN PHẢI */

.branch {
    position: absolute;
    top: -5px;
    right: -10px;
    width: clamp(120px, 15vw, 235px);
    z-index: -1;
    pointer-events: none;
}

/* MÂY TRANG TRÍ */

.cloud {
    position: absolute;
    z-index: -1;
    width: clamp(150px, 21vw, 320px);
    opacity: .95;
    pointer-events: none;
}

.cloud-1 {
    top: 13%;
    left: 18%;
}

.cloud-2 {
    top: 26%;
    left: 8%;
    width: clamp(150px, 17vw, 250px);
}

.cloud-3 {
    top: 26%;
    left: 57%;
    width: clamp(150px, 17vw, 250px);
}

.cloud-4 {
    top: 23%;
    right: -25px;
}

.cloud-5 {
    top: 49%;
    left: 38%;
    width: clamp(160px, 20vw, 270px);
}

.cloud-6 {
    bottom: 1%;
    left: 0;
}

.cloud-7 {
    bottom: 5%;
    right: 2%;
}

/* ================= TIÊU ĐỀ ================= */

.header {
    position: relative;
    height: clamp(280px, 20.6vw, 340px);
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 0;
}

.book {
    position: absolute;
    width: clamp(220px, 26vw, 400px);
    left: 50%;
    top: 53%;
    transform: translate(-50%, -42%) rotate(3deg);
    z-index: -1;
}

.title {
    margin: 0;
    position: relative;
    text-align: center;
    white-space: nowrap;
    font-family: "Lobster", "Brush Script MT", cursive;
    font-size: clamp(78px, 10vw, 155px);
    font-weight: 400;
    line-height: 1.1;
    letter-spacing: 1px;
    color: var(--orange);
    -webkit-text-stroke: 2px var(--brown);
    paint-order: stroke fill;
    text-shadow:
        2px 3px 0 var(--brown),
        4px 5px 0 rgba(100, 40, 15, .15);
}

/* ================= THANH MENU ================= */

.menu {
    display: flex;
    flex-direction: column;
    gap: clamp(35px, 3.05vw, 50px);
    width: 100%;
    max-width: 1600px;
    margin: 0 auto;
}

.menu-item {
    position: relative;
    display: grid;
    grid-template-columns: 120px minmax(0, 1fr) 120px;
    align-items: center;
    min-height: clamp(115px, 8.2vw, 145px);
    padding: 8px 25px;
    overflow: hidden;

    color: #fff;
    background: var(--red);
    border: 2px solid var(--gold);
    text-decoration: none;

    box-shadow:
        inset 0 0 0 2px var(--red),
        inset 0 0 0 4px #f6c82e;

    transition:
        filter .2s ease,
        box-shadow .2s ease;
}

/* HOA VĂN GÓC */

.corner {
    position: absolute;
    width: 23px;
    height: 23px;
    pointer-events: none;
}

.corner::before,
.corner::after {
    content: "";
    position: absolute;
    border: 1px solid var(--gold);
}

.corner::before {
    inset: 0;
}

.corner::after {
    inset: 5px;
}

.corner span {
    position: absolute;
    width: 6px;
    height: 6px;
    border: 1px solid var(--gold);
}

.tl {
    top: 3px;
    left: 3px;
}

.tr {
    top: 3px;
    right: 3px;
}

.bl {
    bottom: 3px;
    left: 3px;
}

.br {
    bottom: 3px;
    right: 3px;
}

.tl::before { border-width: 2px 0 0 2px; }
.tr::before { border-width: 2px 2px 0 0; }
.bl::before { border-width: 0 0 2px 2px; }
.br::before { border-width: 0 2px 2px 0; }

/* HÌNH TRÒN MÀU KEM */

.circle {
    justify-self: center;
    display: grid;
    place-items: center;
    width: clamp(65px, 5.1vw, 83px);
    height: clamp(65px, 5.1vw, 83px);
    border-radius: 50%;
    background: var(--cream);
}

.circle svg {
    width: 76%;
    height: 76%;
}

/* TÊN DANH MỤC */

.label {
    text-align: center;
    font-size: clamp(30px, 3.5vw, 58px);
    font-weight: bold;
    line-height: 1.15;
}

/* NÚT TẢI XUỐNG */

.download {
    justify-self: center;
    display: grid;
    place-items: center;
    width: clamp(60px, 5vw, 82px);
    height: clamp(60px, 5vw, 82px);
    color: white;
    border-radius: 7px;
    transition:
        transform .2s ease,
        background .2s ease;
}

.download svg {
    display: block;
    width: 100%;
    height: 100%;
    fill: currentColor;
}

.menu-item:hover {
    filter: brightness(1.1);
    box-shadow:
        inset 0 0 0 2px var(--red),
        inset 0 0 0 4px var(--gold),
        0 5px 14px rgba(100, 30, 0, .15);
}

.menu-item:hover .download {
    background: rgba(255, 255, 255, .14);
    transform: translateY(-2px);
}

.menu-item:active .download {
    transform: scale(.88);
}

.menu-item:focus-visible {
    outline: 3px solid var(--brown);
    outline-offset: 3px;
}

.note {
    text-align: center;
    color: #42652b;
    font-size: 12px;
    margin-top: 28px;
}

/* ================= ĐIỆN THOẠI ================= */

@media (max-width: 600px) {
    .page {
        padding: 0 4% 25px;
    }

    .header {
        height: 225px;
    }

    .title {
        font-size: clamp(52px, 11vw, 75px);
        letter-spacing: 0;
        -webkit-text-stroke: 1.4px var(--brown);
    }

    .book {
        width: 200px;
    }

    .menu {
        gap: 24px;
    }

    .menu-item {
        grid-template-columns: 54px minmax(0, 1fr) 48px;
        min-height: 90px;
        padding: 5px 8px;
    }

    .circle {
        width: 46px;
        height: 46px;
    }

    .label {
        font-size: clamp(21px, 5vw, 31px);
    }

    .download {
        width: 43px;
        height: 43px;
    }

    .willow {
        width: 125px;
    }

    .branch {
        width: 105px;
    }

    .cloud-4 {
        width: 180px;
    }

    .cloud-6,
    .cloud-7 {
        width: 180px;
    }
}
</style>
</head>
